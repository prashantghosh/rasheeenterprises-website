<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/rashee-enterprises-design-system-cf8188ee-c8e4-4da6-bbdf-f765ea4e77f9/tokens/fonts.css">
<link rel="stylesheet" href="_ds/rashee-enterprises-design-system-cf8188ee-c8e4-4da6-bbdf-f765ea4e77f9/tokens/colors.css">
<link rel="stylesheet" href="_ds/rashee-enterprises-design-system-cf8188ee-c8e4-4da6-bbdf-f765ea4e77f9/tokens/typography.css">
<link rel="stylesheet" href="_ds/rashee-enterprises-design-system-cf8188ee-c8e4-4da6-bbdf-f765ea4e77f9/tokens/spacing.css">
<link rel="stylesheet" href="_ds/rashee-enterprises-design-system-cf8188ee-c8e4-4da6-bbdf-f765ea4e77f9/tokens/effects.css">
<link rel="stylesheet" href="_ds/rashee-enterprises-design-system-cf8188ee-c8e4-4da6-bbdf-f765ea4e77f9/styles.css">
<script src="rs-icon.js"></script>
<script src="_ds/rashee-enterprises-design-system-cf8188ee-c8e4-4da6-bbdf-f765ea4e77f9/_ds_bundle.js"></script>
<style>
a{color:var(--rs-blue-800);}
a:hover{color:var(--rs-blue-900);}
*,*::before,*::after{box-sizing:border-box}
:focus-visible{outline:3px solid var(--rs-blue-700);outline-offset:2px;}
</style>
</helmet>
<div style="display:flex;flex-direction:column;height:100%;background:var(--rs-white);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 1px 2px rgba(26,34,43,.06);font-family:var(--font-body)" style-hover="box-shadow:0 10px 26px rgba(26,34,43,.13);border-color:var(--rs-blue-300)">
  <div role="img" aria-label="{{ alt }}" style="{{ imgStyle }}">
    <span style="{{ blobA }}"></span>
    <span style="{{ blobB }}"></span>
    <span style="{{ blobC }}"></span>
    <sc-if value="{{ eco }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--rs-white);color:#1d6243;border:1px solid #247651;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">
        <x-import component-from-global-scope="RsIcon" name="leaf" size="13" hint-size="13px,13px"></x-import>
        Recyclable
      </span>
    </sc-if>
    <span style="position:absolute;left:12px;bottom:9px;right:12px;font-size:11px;line-height:1.35;color:var(--rs-neutral-600)">{{ shot }}</span>
  </div>
  <div style="{{ bodyStyle }}">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="{{ titleStyle }}">{{ name }}</span>
      <span style="font-size:13.5px;line-height:1.5;color:var(--rs-neutral-700)">{{ blurb }}</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      <sc-for list="{{ badges }}" as="b" hint-placeholder-count="3">
        <span style="display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:var(--rs-neutral-100);border:1px solid var(--rs-neutral-300);font-size:12px;font-weight:600;color:var(--rs-neutral-800)">{{ b }}</span>
      </sc-for>
    </div>
    <div style="display:flex;flex-direction:column;gap:3px;padding-top:12px;border-top:1px solid var(--border-subtle)">
      <span style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--rs-neutral-600)">{{ metaLabel }}</span>
      <span style="font-size:14px;font-weight:500;color:var(--rs-neutral-900)">{{ metaValue }}</span>
    </div>
    <span style="display:inline-flex;align-self:flex-start;align-items:center;gap:7px;min-height:30px;padding:4px 11px;border-radius:var(--radius-md);background:var(--rs-gold-100);border:1px solid var(--rs-gold-200);font-size:12px;font-weight:700;line-height:1.3;color:#6d5019">
      <x-import component-from-global-scope="RsIcon" name="stamp" size="14" hint-size="14px,14px"></x-import>
      {{ moq }}
    </span>
    <div style="flex:1"></div>
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:20px;font-weight:700;color:var(--rs-neutral-900)">{{ price }}</span>
      <span style="font-size:12px;line-height:1.45;color:var(--rs-neutral-600)">{{ priceNote }}</span>
    </div>
    <a href="#" style="{{ ctaStyle }}" style-hover="background:var(--rs-blue-50);border-color:var(--rs-blue-800);color:var(--rs-blue-900)">
      View Details
      <x-import component-from-global-scope="RsIcon" name="arrow-right" size="17" hint-size="17px,17px"></x-import>
    </a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:560},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;BOPP Self-Adhesive Tapes&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;blurb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The workhorse carton seal.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badges&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;metaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Adhesive&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;metaValue&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Water-based acrylic&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;moq&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Custom print from 1 box&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;From ₹385 per box&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;priceNote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;D2C pricing. For bulk and custom orders, please enquire.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;shot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eco&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;artwork&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bopp&quot;,&quot;printed&quot;,&quot;strapping&quot;,&quot;masking&quot;],&quot;default&quot;:&quot;bopp&quot;,&quot;tsType&quot;:&quot;'bopp'|'printed'|'strapping'|'masking'&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;'desktop'|'mobile'&quot;}}">
const ART = {
  bopp: {
    bg: "linear-gradient(140deg,#eef8fc 0%,#e8eef2 58%,#d3e9f6 100%)",
    a: { position: "absolute", width: 176, height: 176, borderRadius: "50%", right: -42, top: -36, border: "24px solid #b9dcf0" },
    b: { position: "absolute", width: 98, height: 98, borderRadius: "50%", right: 48, top: 76, border: "18px solid #f7e3ab" },
    c: { position: "absolute", width: 132, height: 18, left: 22, bottom: 44, borderRadius: 3, background: "#c99a63" }
  },
  printed: {
    bg: "linear-gradient(140deg,#fdf6e4 0%,#e8eef2 100%)",
    a: { position: "absolute", width: 260, height: 54, right: -30, top: 40, background: "#f3d170", transform: "rotate(-14deg)" },
    b: { position: "absolute", width: 260, height: 22, right: -20, top: 108, background: "#b9dcf0", transform: "rotate(-14deg)" },
    c: { position: "absolute", width: 78, height: 78, borderRadius: "50%", left: 20, bottom: 34, border: "16px solid #ffffff" }
  },
  strapping: {
    bg: "linear-gradient(140deg,#e8eef2 0%,#eef8fc 100%)",
    a: { position: "absolute", width: 168, height: 168, borderRadius: "50%", left: "50%", top: -34, transform: "translateX(-50%)", border: "26px solid #d6f0e2" },
    b: { position: "absolute", width: 116, height: 116, borderRadius: "50%", left: "64%", top: 66, border: "20px solid #b9dcf0" },
    c: { position: "absolute", width: 120, height: 10, left: 20, bottom: 46, borderRadius: 2, background: "#247651" }
  },
  masking: {
    bg: "linear-gradient(140deg,#f4efe6 0%,#e8eef2 62%,#eef8fc 100%)",
    a: { position: "absolute", width: 150, height: 150, borderRadius: "50%", right: -20, top: 12, border: "30px solid #e4d3ae" },
    b: { position: "absolute", width: 92, height: 92, borderRadius: "50%", right: 96, top: 74, border: "16px solid #b9dcf0" },
    c: { position: "absolute", width: 108, height: 14, left: 24, bottom: 44, borderRadius: 3, background: "#8f9aa3" }
  }
};

class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const mobile = (p.variant || "desktop") === "mobile";
    const art = ART[p.artwork || "bopp"] || ART.bopp;
    return {
      name: p.title || p.name || "Product line",
      blurb: p.blurb || "",
      badges: p.badges || [],
      metaLabel: p.metaLabel || "Adhesive",
      metaValue: p.metaValue || "Water-based acrylic",
      moq: p.moq || "Custom print from 1 box",
      price: p.price || "Priced to spec",
      priceNote: p.priceNote || "D2C pricing. For bulk and custom orders, please enquire.",
      alt: p.alt || "",
      shot: p.shot || "",
      eco: !!p.eco,
      imgStyle: {
        position: "relative",
        aspectRatio: mobile ? "16 / 9" : "4 / 3",
        background: art.bg,
        overflow: "hidden",
        flex: "none"
      },
      blobA: art.a,
      blobB: art.b,
      blobC: art.c,
      bodyStyle: {
        display: "flex", flexDirection: "column", gap: 12,
        padding: mobile ? 16 : 18, flex: "1 1 auto"
      },
      titleStyle: {
        fontFamily: "var(--font-display)",
        fontSize: mobile ? 21 : 22,
        lineHeight: 1.15, fontWeight: 600, color: "var(--rs-neutral-900)"
      },
      ctaStyle: {
        display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
        minHeight: mobile ? 48 : 44, border: "1px solid var(--rs-blue-700)",
        borderRadius: "var(--radius-md)", background: "var(--rs-white)",
        color: "var(--rs-blue-800)", fontSize: mobile ? 16 : 15, fontWeight: 600,
        textDecoration: "none"
      }
    };
  }
}

</script>
</body>
</html>
